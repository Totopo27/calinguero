# NOTICE: Modified for the Calinguero project in 2026.
name: Build IPK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:all

      - name: Lint and compatibility gate
        run: npm run lint

      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Chromium's system libraries come preinstalled, so no job waits on apt
    # mirrors. Keep the tag in step with @playwright/test in the lockfile.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A no-op while the image matches the lockfile; otherwise it fetches the
      # browser, still without apt.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: test-output/
          retention-days: 7

  package:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli@3.2.5

      - name: Cache service runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/webos-iptv-player/node-runtimes
          key: service-node-runtimes-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Bundle
        run: node esbuild.config.mjs

      - name: Build service
        run: npm run service:smoke:matrix

      - name: Package IPK
        run: ares-package --no-minify -e "*preview-libs.js" dist build/bundled-service -o .

      - name: Upload IPK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calinguero-m0-ipk
          path: "*.ipk"
          retention-days: 7
